version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fake_or_real_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fakeorreal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-fakeorreal_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fakeorreal_user} -d ${POSTGRES_DB:-fakeorreal_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fake_or_real_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fake_or_real_backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fakeorreal_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fakeorreal_db}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      DEMO_MODE: ${DEMO_MODE:-true}
      SAFE_BROWSING_API_KEY: ${SAFE_BROWSING_API_KEY:-}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AI_PROVIDER: ${AI_PROVIDER:-none}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      NETWORK_SCANNERS_ENABLED: ${NETWORK_SCANNERS_ENABLED:-false}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://localhost}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fake_or_real_frontend
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
